<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#111; font-family: 'Segoe UI', Arial, sans-serif;
  }
  #gameContainer {
    position:relative; width:100%; height:100%;
    background:#000; overflow:hidden;
  }
  /* #gameFrame có đúng tỉ lệ 960:540 và luôn canh giữa,
     mọi HUD/nút bên trong sẽ bám sát 4 cạnh của khung này
     (không phải cạnh màn hình) nên luôn khớp với canvas */
  #gameFrame {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
  }
  canvas#game {
    background:#87CEEB;
    display:block;
    image-rendering: pixelated;
    touch-action:none;
  }
  #minimapWrap {
    position:absolute; top:8px; right:8px; z-index:5;
    display:flex; flex-direction:column; align-items:center;
  }
  #minimap {
    width:90px; height:90px;
    border:2px solid rgba(255,255,255,.6); border-radius:6px;
    background:rgba(0,0,0,.4); display:block;
  }
  #minimapLabel {
    margin-top:3px; color:#fff; font-size:9px; font-weight:bold;
    text-shadow:0 1px 3px rgba(0,0,0,.8); background:rgba(0,0,0,.35);
    padding:1px 7px; border-radius:4px; letter-spacing:.5px;
  }
  /* Joystick ảo cho mobile - bám cố định góc dưới trái CỦA KHUNG GAME */
  #joyZone {
    position:absolute; left:0; bottom:0; width:45%; height:45%;
    z-index:10; touch-action:none;
  }
  #joyBase {
    position:absolute; left:80px; bottom:80px;
    width:100px; height:100px; border-radius:50%;
    background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.45);
    transform:translate(-50%,50%);
  }
  #joyStick {
    position:absolute; left:50%; top:50%; width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,.6); border:2px solid rgba(255,255,255,.85);
    transform:translate(-50%,-50%);
  }
  /* Nút "Trở về" - quay lại trang chat, góc trên trái */
  #backBtn {
    position:absolute; top:8px; left:8px; z-index:15;
    display:flex; align-items:center; gap:5px;
    background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.5);
    color:#fff; font-size:12px; font-weight:bold;
    padding:6px 12px; border-radius:20px; user-select:none;
  }
  #musicBtn {
    position:absolute; top:8px; left:100px; z-index:15;
    width:30px; height:30px; border-radius:50%;
    background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.5);
    color:#fff; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    user-select:none; cursor:pointer;
  }
  #playerTag {
    position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:5;
    background:rgba(0,0,0,.35); color:#fff; font-size:11px;
    padding:4px 10px; border-radius:12px; text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  #interactBtn {
    position:absolute; right:20px; bottom:20px; z-index:10;
    width:68px; height:68px; border-radius:50%;
    background:rgba(255,180,50,.8); border:3px solid rgba(255,255,255,.85);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
    color:#fff; font-weight:bold; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }

  /* ---------- HOTBAR (thanh ô đồ dưới màn hình) ---------- */
  #hotbar {
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; gap:6px; z-index:10;
  }
  .hotSlot {
    width:44px; height:44px; border-radius:9px;
    background:rgba(20,20,20,.55); border:2px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    position:relative; font-size:19px; user-select:none;
  }
  .hotSlot.active {
    border-color:#ffd24d; box-shadow:0 0 0 2px rgba(255,210,77,.6);
    background:rgba(80,60,10,.6);
  }
  .hotSlot.empty { opacity:.35; }
  .hotSlot .cnt {
    position:absolute; right:2px; bottom:1px; font-size:9px; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.9); font-weight:bold;
  }
  .hotSlot .key {
    position:absolute; left:2px; top:1px; font-size:8px; color:#fff;
    opacity:.7;
  }
  #msgBox {
    position:absolute; left:50%; bottom:14%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 18px;
    border-radius:8px; font-size:15px; display:none; z-index:8;
    max-width:80%; text-align:center; pointer-events:none;
  }
  #fishGame {
    position:absolute; z-index:25; display:none; flex-direction:column; align-items:center;
    width:170px; pointer-events:none;
    transform:translate(-50%, -100%);
    background:rgba(8,12,20,.85); border:2px solid rgba(255,255,255,.6);
    border-radius:12px; padding:9px 11px 10px; box-shadow:0 4px 18px rgba(0,0,0,.55);
  }
  #fishGame::after {
    content:''; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-top:9px solid rgba(8,12,20,.85);
  }
  #fishBarWrap {
    position:relative; width:100%; height:22px;
    background:rgba(5,15,25,.95); border-radius:10px;
    border:2px solid rgba(255,255,255,.5); overflow:hidden;
  }
  #fishZone {
    position:absolute; top:1px; bottom:1px;
    background:#3ddc84; border-left:2px solid #eaffef; border-right:2px solid #eaffef;
    border-radius:5px; box-shadow:0 0 10px 2px rgba(61,220,132,.9), inset 0 0 6px rgba(255,255,255,.6);
  }
  #fishCursor {
    position:absolute; top:-2px; bottom:-2px; width:5px;
    background:#fff; border-radius:3px; box-shadow:0 0 8px 3px rgba(255,255,255,.95);
  }
  #fishHint {
    margin-top:7px; color:#fff; font-size:12px; text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,.95), 0 0 3px #000; font-weight:bold;
    line-height:1.3;
  }
  #fishProgWrap {
    margin-top:6px; width:100%; height:9px;
    background:rgba(5,15,25,.95); border-radius:6px;
    border:2px solid rgba(255,255,255,.45); overflow:hidden;
  }
  #fishProg { height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#8bff9e); transition:width .08s linear; }

  #helpHint {
    position:absolute; bottom:8px; left:10px; color:#fff;
    font-size:12px; opacity:.7; z-index:5;
  }

  /* ---------- TÚI ĐỒ & CHẾ TẠO ---------- */
  #invBar {
    position:absolute; top:44px; left:8px; z-index:12;
    display:flex; gap:6px; flex-wrap:wrap; max-width:55%;
    background:rgba(0,0,0,.35); padding:6px 8px; border-radius:8px;
  }
  .invItem {
    display:flex; align-items:center; gap:3px; color:#fff;
    font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap;
  }
  .invItem .ic { font-size:14px; }

  /* ---------- CỬA HÀNG (giao diện quầy hàng gỗ ấm áp) ---------- */
  #shopOverlay {
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 18%, rgba(80,55,25,.35), rgba(0,0,0,.75) 72%);
    backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:20;
    padding:16px;
  }
  #shopPanel {
    position:relative; display:flex; flex-direction:column; overflow:hidden;
    background:
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.1)),
      linear-gradient(150deg, #402c1b 0%, #291c11 100%);
    border:3px solid #6e4a28; border-radius:16px;
    width:92%; max-width:440px; max-height:86%;
    color:#f4e9d8;
    box-shadow:0 16px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  #shopHeader {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px 12px;
    background:linear-gradient(180deg, rgba(255,205,120,.16), transparent);
    border-bottom:2px solid rgba(255,255,255,.08);
  }
  #shopHeader h3 {
    margin:0; font-size:17px; letter-spacing:.3px; font-weight:800;
    display:flex; align-items:center; gap:7px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  #shopHeaderRight { display:flex; align-items:center; gap:8px; }
  #shopWallet {
    display:flex; align-items:center; gap:5px;
    background:linear-gradient(180deg,#5a3d18,#2c1c0c);
    border:1px solid rgba(255,210,120,.55);
    color:#ffd97a; font-weight:800; font-size:13px;
    padding:5px 11px; border-radius:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 6px rgba(0,0,0,.4);
  }
  #shopClose {
    cursor:pointer; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; width:28px; height:28px; border-radius:50%; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  #shopClose:active { background:rgba(255,255,255,.3); }
  #shopList { overflow-y:auto; padding:12px 14px 16px; }
  #shopList::-webkit-scrollbar { width:7px; }
  #shopList::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:4px; }
  .shopSection { margin-bottom:14px; }
  .shopSection:last-child { margin-bottom:2px; }
  .shopSectionTitle {
    display:flex; align-items:center; gap:7px;
    font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:#e9cd97; margin:0 0 8px 2px;
  }
  .shopSectionTitle .bar { flex:1; height:1px; background:linear-gradient(90deg, rgba(255,210,130,.4), transparent); }
  .recipeCard {
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.09); border-radius:11px;
    padding:9px 10px; margin-bottom:7px;
  }
  .recipeIcon {
    flex:none; width:36px; height:36px; border-radius:9px;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.2), rgba(0,0,0,.3));
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .recipeInfo { flex:1; min-width:0; font-size:12px; line-height:1.45; }
  .recipeInfo b { font-size:13px; display:block; color:#fff; }
  .recipeSub { display:block; opacity:.7; font-size:11px; }
  .recipeCost {
    display:inline-flex; align-items:center; gap:3px;
    margin-top:3px; font-size:11px; font-weight:800; color:#ffd97a;
  }
  .recipeBtn {
    flex:none; background:linear-gradient(180deg,#63d270,#3e9e4c);
    border:1px solid rgba(255,255,255,.28); color:#fff; padding:8px 14px;
    border-radius:20px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .recipeBtn:active { transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .recipeBtn:disabled {
    background:#555; border-color:rgba(255,255,255,.08); color:rgba(255,255,255,.5);
    cursor:not-allowed; box-shadow:none;
  }
  .recipeBtn.sellBtn { background:linear-gradient(180deg,#ffbe57,#e0862b); }
  .recipeBtn.sellBtn:disabled { background:#555; }

  /* ---------- BONG BÓNG CHAT CHUNG (GÓC MÀN HÌNH) ---------- */
  #chatBubble {
    position:absolute; right:20px; bottom:100px; z-index:10;
    width:48px; height:48px; border-radius:50%;
    background:rgba(60,180,140,.85); border:3px solid rgba(255,255,255,.85);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
    color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  #chatBubble .chatDot {
    position:absolute; top:-2px; right:-2px; width:10px; height:10px;
    border-radius:50%; background:#ff4d4d; border:2px solid #fff; display:none;
  }
  #chatPanel {
    position:absolute; right:20px; bottom:156px; z-index:11;
    width:200px; max-height:200px;
    background:rgba(15,17,22,.85); border:2px solid rgba(255,255,255,.35);
    border-radius:10px; display:none; flex-direction:column; overflow:hidden;
  }
  #chatMessages {
    flex:1; overflow-y:auto; padding:6px 8px; display:flex; flex-direction:column; gap:3px;
    max-height:140px;
  }
  .chatMsg { font-size:11px; color:#fff; line-height:1.3; word-break:break-word; }
  .chatMsg b { color:#7fd6ff; }
  #chatInputRow { display:flex; border-top:1px solid rgba(255,255,255,.2); }
  #chatInput {
    flex:1; border:none; outline:none; background:rgba(255,255,255,.08);
    color:#fff; font-size:11px; padding:6px 7px;
  }
  #chatInput::placeholder { color:rgba(255,255,255,.4); }
  #chatSendBtn {
    border:none; background:rgba(60,180,140,.85); color:#fff; font-size:11px;
    padding:0 10px; cursor:pointer;
  }

  /* ---------- ÉP XOAY NGANG TRÊN ĐIỆN THOẠI ---------- */
  /* Khi màn hình đang ở chế độ dọc trên thiết bị cảm ứng (điện thoại),
     ta xoay #gameContainer 90 độ để game luôn hiển thị ngang.
     Dùng JS set width/height bằng px thực tế (thay vì vw/vh) để
     không bị lệch khi thanh địa chỉ Chrome mobile ẩn/hiện. */
  html, body { width:100%; height:100%; }
  #rotateRoot {
    width:100%; height:100%; overflow:hidden;
  }
  #rotateRoot.forced-landscape {
    transform: rotate(90deg);
    transform-origin: top left;
    position:fixed;
    top:0; left:100%;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<script>
(function(){
  "use strict";

  /* ===========================================================
     MODULE GAME 2D THẾ GIỚI MỞ
     - Bản đồ tile lớn hơn màn hình, camera theo nhân vật
     - Va chạm với chướng ngại vật (obstacles)
     - Vùng bản đồ (zones) hiển thị theo vị trí
     - NPC / điểm tương tác (interactables)
     - Điều khiển: bàn phím (WASD/mũi tên) + joystick ảo cho mobile
     - Minimap
     Bạn có thể copy toàn bộ IIFE này vào project khác,
     hoặc export các hàm/class cần thiết ra ngoài.
  =========================================================== */

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const miniCanvas = document.getElementById('minimap');
  const miniCtx = miniCanvas.getContext('2d');

  // ---------- CẤU HÌNH THẾ GIỚI ----------
  const TILE = 40;                 // kích thước 1 ô tile (px)
  const WORLD_COLS = 60;           // số cột của thế giới
  const WORLD_ROWS = 40;           // số hàng của thế giới
  const WORLD_W = TILE * WORLD_COLS;
  const WORLD_H = TILE * WORLD_ROWS;

  // Loại tile: 0 = cỏ, 1 = nước, 2 = cát, 3 = rừng, 4 = đá, 5 = đất nông trại
  const TILE_COLORS = {
    0: '#5fb35f',
    1: '#3a7bd5',
    2: '#e0c58a',
    3: '#2e7d32',
    4: '#8a8a8a',
    5: '#6b4a2b'
  };
  const TILE_SOLID = { 1:true, 4:true }; // tile không đi qua được (nước, đá)

  // ---------- PRNG CÓ SEED CỐ ĐỊNH ----------
  // Dùng để sinh bản đồ + vị trí cây/đá GIỐNG HỆT NHAU trên mọi máy, mọi người chơi.
  // (Trước đây dùng Math.random() thuần nên mỗi người vào game thấy một bản đồ khác nhau)
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const WORLD_SEED = 20260815; // seed cố định của bản đồ chung
  const worldRng = mulberry32(WORLD_SEED);

  // Sinh bản đồ ngẫu nhiên đơn giản dùng noise giả (value noise nhẹ)
  function generateWorld() {
    const map = [];
    for (let y = 0; y < WORLD_ROWS; y++) {
      const row = [];
      for (let x = 0; x < WORLD_COLS; x++) {
        row.push(0); // mặc định cỏ
      }
      map.push(row);
    }

    // Hồ nước ở giữa bản đồ
    const lakeCx = 30, lakeCy = 20, lakeR = 6;
    for (let y = 0; y < WORLD_ROWS; y++) {
      for (let x = 0; x < WORLD_COLS; x++) {
        const d = Math.hypot(x - lakeCx, y - lakeCy);
        if (d < lakeR) map[y][x] = 1;
        else if (d < lakeR + 1.5) map[y][x] = 2; // viền cát quanh hồ
      }
    }

    // Rừng góc trên trái
    for (let y = 2; y < 14; y++) {
      for (let x = 2; x < 16; x++) {
        if (worldRng() < 0.55) map[y][x] = 3;
      }
    }

    // Vùng đá góc dưới phải
    for (let y = 28; y < 38; y++) {
      for (let x = 44; x < 58; x++) {
        if (worldRng() < 0.4) map[y][x] = 4;
      }
    }

    // Rải đá lẻ tẻ làm chướng ngại vật
    for (let i = 0; i < 80; i++) {
      const x = Math.floor(worldRng() * WORLD_COLS);
      const y = Math.floor(worldRng() * WORLD_ROWS);
      if (map[y][x] === 0 && worldRng() < 0.5) map[y][x] = 4;
    }

    return map;
  }

  const worldMap = generateWorld();

  function isSolidAtWorld(px, py) {
    const tx = Math.floor(px / TILE);
    const ty = Math.floor(py / TILE);
    if (tx < 0 || ty < 0 || tx >= WORLD_COLS || ty >= WORLD_ROWS) return true;
    return !!TILE_SOLID[worldMap[ty][tx]];
  }

  function zoneNameAt(px, py) {
    const tx = Math.floor(px / TILE);
    const ty = Math.floor(py / TILE);
    if (tx < 0 || ty < 0 || tx >= WORLD_COLS || ty >= WORLD_ROWS) return 'Vùng chưa khám phá';
    const t = worldMap[ty][tx];
    return { 0:'Đồng cỏ', 1:'Hồ nước', 2:'Bãi cát', 3:'Rừng cây', 4:'Vùng đá', 5:'Nông trại' }[t];
  }

  // ---------- TÀI NGUYÊN THU THẬP ĐƯỢC (CÂY, ĐÁ) ----------
  // type: 'wood' (chặt cây) | 'stone' (đào đá)
  // hp: số lần đánh cần để phá; respawn: giây hồi sinh sau khi phá xong
  // id của mỗi node = thứ tự sinh ra (dùng worldRng có seed cố định nên thứ tự này
  // GIỐNG HỆT NHAU trên mọi máy) -> dùng làm khoá đồng bộ trạng thái qua Firebase.
  const resourceNodes = [];
  function spawnResourceNodes() {
    // Cây rải quanh vùng rừng (loại tile 3) + rải thêm lẻ tẻ
    for (let ty = 0; ty < WORLD_ROWS; ty++) {
      for (let tx = 0; tx < WORLD_COLS; tx++) {
        if (worldMap[ty][tx] === 3 && worldRng() < 0.5) {
          resourceNodes.push({
            id: resourceNodes.length,
            type:'wood', tx, ty,
            x: tx*TILE + TILE/2, y: ty*TILE + TILE/2,
            hp:15, maxHp:15, alive:true, respawnAt:0
          });
        }
      }
    }
    // Đá rải quanh vùng đá (loại tile 4)
    for (let ty = 0; ty < WORLD_ROWS; ty++) {
      for (let tx = 0; tx < WORLD_COLS; tx++) {
        if (worldMap[ty][tx] === 4 && worldRng() < 0.6) {
          resourceNodes.push({
            id: resourceNodes.length,
            type:'stone', tx, ty,
            x: tx*TILE + TILE/2, y: ty*TILE + TILE/2,
            hp:12, maxHp:12, alive:true, respawnAt:0
          });
        }
      }
    }
  }
  spawnResourceNodes();

  // Thời gian hồi (giây) sau khi bị phá xong: 9 phút = 540 giây, ÁP DỤNG CHUNG
  // cho mọi người chơi (đồng bộ qua Firebase, không phải riêng từng máy).
  const RESOURCE_STYLE = {
    wood:  { icon:'🌳', deadIcon:'🪵', give:'wood',  giveName:'Gỗ',  giveIcon:'🪵', amount:[1,1], respawn: 540 },
    stone: { icon:'🪨', deadIcon:'⛏️', give:'stone', giveName:'Đá',  giveIcon:'🪨', amount:[1,1], respawn: 540 }
  };

  // ---------- TÚI ĐỒ (INVENTORY) ----------
  const inventory = { wood:0, stone:0, coin:20 };
  const ITEM_META = {
    wood:  { icon:'🪵', name:'Gỗ' },
    stone: { icon:'🪨', name:'Đá' },
    fish:  { icon:'🐟', name:'Cá' },
    coin:  { icon:'💰', name:'Xu' },
    axe:   { icon:'🪓', name:'Rìu' },
    pickaxe:{icon:'⛏️', name:'Cuốc' },
    rod:   { icon:'🎣', name:'Cần câu' },
    seed_rice: { icon:'🌱', name:'Hạt giống lúa' },
    rice:      { icon:'🌾', name:'Lúa' }
  };
  function addItem(id, n) {
    inventory[id] = (inventory[id]||0) + n;
    renderInventory();
    if (typeof renderHotbar === 'function') renderHotbar();
    if (typeof scheduleSave === 'function') scheduleSave();
  }
  function hasItems(cost) {
    return Object.entries(cost).every(([k,v]) => (inventory[k]||0) >= v);
  }
  function payItems(cost) {
    Object.entries(cost).forEach(([k,v]) => { inventory[k] -= v; });
    renderInventory();
    if (typeof scheduleSave === 'function') scheduleSave();
  }
  function renderInventory() {
    const bar = document.getElementById('invBar');
    const entries = Object.entries(inventory).filter(([k,v]) => v > 0);
    if (entries.length === 0) {
      bar.innerHTML = '<div class="invItem" style="opacity:.6">Túi đồ trống</div>';
      return;
    }
    bar.innerHTML = entries.map(([k,v]) =>
      `<div class="invItem"><span class="ic">${(ITEM_META[k]||{}).icon||'❔'}</span>${v}</div>`
    ).join('');
  }
  renderInventory();

  // ---------- CỬA HÀNG: BÁN TÀI NGUYÊN & MUA ĐỒ ----------
  // Bán gỗ/đá lấy xu, rồi dùng xu mua công cụ & công trình
  const sellOffers = [
    { id:'sell_wood', from:'wood', name:'Bán Gỗ', icon:'🪵', price:1 },
    { id:'sell_stone', from:'stone', name:'Bán Đá', icon:'🪨', price:1 },
    { id:'sell_fish', from:'fish', name:'Bán Cá', icon:'🐟', price:2 },
    { id:'sell_rice', from:'rice', name:'Bán Lúa', icon:'🌾', price:5 },
  ];
  const recipes = [
    { id:'axe', name:'Rìu gỗ', icon:'🪓', desc:'Chặt cây nhanh & mạnh hơn (độ bền 40)',
      cost:{coin:20}, durability:40, onCraft:()=>{ playerTools.axe = 40; renderHotbar(); if (typeof scheduleSave === 'function') scheduleSave(); } },
    { id:'pickaxe', name:'Cuốc gỗ', icon:'⛏️', desc:'Đào đá nhanh & mạnh hơn (độ bền 40)',
      cost:{coin:20}, durability:40, onCraft:()=>{ playerTools.pickaxe = 40; renderHotbar(); if (typeof scheduleSave === 'function') scheduleSave(); } },
    { id:'rod', name:'Cần câu', icon:'🎣', desc:'Đứng cạnh nước để câu cá (độ bền 40)',
      cost:{coin:25}, durability:40, onCraft:()=>{ playerTools.rod = 40; renderHotbar(); if (typeof scheduleSave === 'function') scheduleSave(); } },

  const playerTools = { axe:0, pickaxe:0, rod:0 }; // 0 = chưa có / đã hỏng; số còn lại = độ bền dùng được

  // Hạt giống: vật phẩm tiêu hao, mua bao nhiêu lần cũng được, cộng dồn vào túi đồ

  // ---------- DỮ LIỆU CÂY TRỒNG (thời gian lớn tính bằng giây, sản lượng thu hoạch) ----------
  const CROP_META = {
    seed_rice: { growTime:540, yieldMin:1, yieldMax:1, harvestId:'rice' }, // 9 phút
  };
  const SEED_PRIORITY = ['seed_rice']; // thứ tự ưu tiên tự trồng

  // Trạng thái các ô đất CỦA RIÊNG tài khoản này: { [plotIdx]: {seed, plantedAt} }
  // -> lưu/đọc qua saveRef (game_open_world/{myKey}) giống inventory, nên mỗi
  //    tài khoản đăng nhập khác nhau sẽ có chỗ trồng hoàn toàn độc lập.
  const farmPlots = {};

  function farmPlotStatus(idx) {
    const st = farmPlots[idx];
    if (!st || !CROP_META[st.seed]) return { state:'empty' };
    const meta = CROP_META[st.seed];
    const elapsed = (Date.now() - st.plantedAt) / 1000;
    if (elapsed >= meta.growTime) return { state:'ready', seed: st.seed };
    return { state:'growing', seed: st.seed, progress: Math.min(1, elapsed / meta.growTime) };
  }
  function plantAt(plotIdx) {
    const seedId = SEED_PRIORITY.find(id => (inventory[id]||0) > 0);
    if (!seedId) { showMessage('🌱 Bạn hết hạt giống rồi! Ghé Cửa hàng mua thêm.', 1800); if (typeof sfx !== 'undefined') sfx.error(); return; }
    inventory[seedId] -= 1;
    farmPlots[plotIdx] = { seed: seedId, plantedAt: Date.now() };
    renderInventory();
    showMessage(`Đã trồng ${ITEM_META[seedId].icon} ${ITEM_META[seedId].name}!`, 1400);
    if (typeof sfx !== 'undefined') sfx.plant();
    if (typeof scheduleSave === 'function') scheduleSave();
  }
  function harvestAt(plotIdx) {
    const st = farmPlots[plotIdx];
    if (!st || !CROP_META[st.seed]) return;
    const meta = CROP_META[st.seed];
    const amount = meta.yieldMin + Math.floor(Math.random() * (meta.yieldMax - meta.yieldMin + 1));
    delete farmPlots[plotIdx];
    addItem(meta.harvestId, amount);
    showMessage(`🌾 Thu hoạch được ${amount} ${ITEM_META[meta.harvestId].icon} ${ITEM_META[meta.harvestId].name}!`, 1800);
    if (typeof sfx !== 'undefined') sfx.harvest();
  }

  // ---------- HOTBAR (thanh ô đồ trang bị) ----------
  // Chỉ những công cụ cầm-tay mới vào hotbar; "equipped" là công cụ đang cầm
  const HOTBAR_IDS = ['axe', 'pickaxe', 'rod'];
  let equipped = null; // 'axe' | 'pickaxe' | 'rod' | null

  function renderHotbar() {
    const bar = document.getElementById('hotbar');
    bar.innerHTML = HOTBAR_IDS.map((id, i) => {
      const owned = (playerTools[id]||0) > 0;
      const active = equipped === id ? 'active' : '';
      const empty = owned ? '' : 'empty';
      return `<div class="hotSlot ${active} ${empty}" data-id="${id}">
        <span class="key">${i+1}</span>${ITEM_META[id].icon}
        ${owned ? `<span class="cnt">${playerTools[id]}</span>` : ''}
      </div>`;
    }).join('');
    bar.querySelectorAll('.hotSlot').forEach(slot => {
      slot.addEventListener('click', () => equipItem(slot.dataset.id));
      slot.addEventListener('touchstart', e => { e.preventDefault(); equipItem(slot.dataset.id); });
    });
  }
  function equipItem(id) {
    if ((playerTools[id]||0) <= 0) { showMessage('Bạn chưa có ' + ITEM_META[id].name + ' còn dùng được! Ghé Cửa hàng để mua.', 1600); return; }
    equipped = (equipped === id) ? null : id;
    showMessage(equipped ? `Đang cầm ${ITEM_META[id].icon} ${ITEM_META[id].name}` : 'Đã cất công cụ', 1100);
    renderHotbar();
  }
  function breakEquippedTool() {
    const id = equipped;
    if (!id) return;
    equipped = null;
    showMessage(`💥 ${ITEM_META[id].icon} ${ITEM_META[id].name} đã hỏng!`, 1600);
    renderHotbar();
  }
  window.addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= HOTBAR_IDS.length) equipItem(HOTBAR_IDS[n-1]);

  function renderShop() {
    const list = document.getElementById('shopList');
    const walletEl = document.getElementById('shopWalletAmt');

    const sellHtml = sellOffers.map(s => {

      return `
        <div class="recipeCard">
          <div class="recipeIcon">${s.icon}</div>
          <div class="recipeInfo">
            <b>${s.name}</b>
            <span class="recipeSub">Bạn có: ${owned} ${s.icon}</span>

    const seedHtml = seedOffers.map(sd => {

      return `
        <div class="recipeCard">
          <div class="recipeIcon">${sd.icon}</div>
          <div class="recipeInfo">
            <b>${sd.name}</b>
            ${owned ? `<span class="recipeSub">Đang có: ${owned}</span>` : ''}
            <div class="recipeCost">${sd.price} 💰 / hạt</div>

        </div>`;
    }).join('');

    const buyHtml = recipes.map(r => {
      const costTxt = Object.entries(r.cost).map(([k,v]) => `${v} ${ITEM_META[k].icon}`).join('  ');
      const durLeft = playerTools[r.id] || 0;
      const owned = durLeft > 0;
      const can = hasItems(r.cost) && !owned;
      return `
        <div class="recipeCard">
          <div class="recipeIcon">${r.icon}</div>
          <div class="recipeInfo">
            <b>${r.name}${owned ? ` <span style="opacity:.7;font-weight:normal">(còn bền: ${durLeft})</span>` : ''}</b>
            <span class="recipeSub">${r.desc}</span>

    list.innerHTML = `
      <div class="shopSection">

        ${seedHtml}

      <div class="shopSection">
        <div class="shopSectionTitle">🛠️ Dụng cụ<span class="bar"></span></div>
        ${buyHtml}
      </div>`;

    list.querySelectorAll('[data-sell]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = sellOffers.find(so => so.id === btn.dataset.sell);
        const owned = inventory[s.from] || 0;
        if (!s || owned <= 0) return;
        const total = owned * s.price;
        payItems({ [s.from]: owned });
        addItem('coin', total);
        showMessage(`Đã bán ${owned} ${s.icon} nhận ${total} 💰!`);
        if (typeof sfx !== 'undefined') sfx.sell();
        renderShop();
      });
    });
    list.querySelectorAll('[data-buy]').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = recipes.find(rc => rc.id === btn.dataset.buy);

        payItems(r.cost);
        r.onCraft();
        showMessage(`Đã mua ${r.icon} ${r.name}!`);
        if (typeof sfx !== 'undefined') sfx.buy();
        renderShop();

    list.querySelectorAll('[data-buyseed]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sd = seedOffers.find(so => so.id === btn.dataset.buyseed);
        if (!sd || (inventory.coin||0) < sd.price) return;
        payItems({ coin: sd.price });
        addItem(sd.id, 1);
        showMessage(`Đã mua ${sd.icon} ${sd.name}!`, 1200);
        if (typeof sfx !== 'undefined') sfx.buy();
        renderShop();
      });

  const shopOverlay = document.getElementById('shopOverlay');
  function openShop() { renderShop(); shopOverlay.style.display = 'flex'; showMessage('🏪 Chào mừng đến cửa hàng!', 1200); }
  function closeShop() { shopOverlay.style.display = 'none'; }
  document.getElementById('shopClose').addEventListener('click', closeShop);
  shopOverlay.addEventListener('click', e => { if (e.target === shopOverlay) closeShop(); });


  // ---------- CỬA HÀNG (vị trí cố định ở phía nam bản đồ) ----------
  const SHOP_TX = 28, SHOP_TY = 37; // gần cạnh dưới (nam) của bản đồ
  const SHOP_X = SHOP_TX*TILE + TILE/2, SHOP_Y = SHOP_TY*TILE + TILE/2;
  // dọn quang khu đất quanh cửa hàng thành cỏ để chắc chắn có thể đi tới
  for (let ty = SHOP_TY-2; ty <= SHOP_TY+2; ty++) {
    for (let tx = SHOP_TX-2; tx <= SHOP_TX+2; tx++) {
      if (tx>=0 && ty>=0 && tx<WORLD_COLS && ty<WORLD_ROWS) worldMap[ty][tx] = 0;
    }
  }

  const interactables = [
    { x: SHOP_X, y: SHOP_Y, r: 18, type:'shop', icon:'🏪', name:'Cửa hàng', color:'#d4a017' }
  ];

  // ---------- NÔNG TRẠI (khu đất trồng, phía TÂY/TRÁI bản đồ) ----------
  // Mỗi tài khoản có trạng thái cây trồng RIÊNG (farmPlots lưu theo saveRef
  // của từng người, không chia sẻ với người chơi khác) — vị trí vật lý các ô
  // đất là chung, nhưng chỉ chủ tài khoản mới thấy/thu hoạch cây của mình.
  const FARM_TX0 = 2, FARM_TY0 = 20, FARM_COLS = 6, FARM_ROWS = 6;
  for (let ty = FARM_TY0-1; ty <= FARM_TY0+FARM_ROWS; ty++) {
    for (let tx = FARM_TX0-1; tx <= FARM_TX0+FARM_COLS; tx++) {
      if (tx>=0 && ty>=0 && tx<WORLD_COLS && ty<WORLD_ROWS) {
        const inPlot = tx>=FARM_TX0 && tx<FARM_TX0+FARM_COLS && ty>=FARM_TY0 && ty<FARM_TY0+FARM_ROWS;
        worldMap[ty][tx] = inPlot ? 5 : 0; // 5 = đất canh tác, viền quanh dọn thành cỏ
      }
    }
  }
  const FARM_PLOTS = [];
  (function setupFarmPlots(){
    let idx = 0;
    for (let ty = FARM_TY0; ty < FARM_TY0+FARM_ROWS; ty++) {
      for (let tx = FARM_TX0; tx < FARM_TX0+FARM_COLS; tx++) {
        FARM_PLOTS.push({ idx: idx++, tx, ty, x: tx*TILE+TILE/2, y: ty*TILE+TILE/2 });
      }
    }
  })();
  // Xoá mọi tài nguyên (cây/đá) lỡ rơi trúng khu nông trại + vùng đệm quanh nó,
  // vì spawnResourceNodes() đã chạy trước khi khu đất này được dọn.
  for (let i = resourceNodes.length - 1; i >= 0; i--) {
    const n = resourceNodes[i];
    if (n.tx >= FARM_TX0-1 && n.tx < FARM_TX0+FARM_COLS+1 &&
        n.ty >= FARM_TY0-1 && n.ty < FARM_TY0+FARM_ROWS+1) {
      resourceNodes.splice(i, 1);
    }
  }


  // ---------- NHÂN VẬT ----------
  const player = {
    x: WORLD_W/2, y: WORLD_H/2, // vị trí giữa bản đồ
    w: 28, h: 28,
    speed: 220,        // px/giây
    hp: 100, maxHp: 100,
    dir: 'down',
    frame: 0, frameTimer: 0
  };

  // đưa player ra khỏi tile solid nếu spawn trúng chướng ngại
  (function ensureSafeSpawn(){
    let tries = 0;
    while (isSolidAtWorld(player.x, player.y) && tries < 500) {
      player.x = Math.random() * WORLD_W;
      player.y = Math.random() * WORLD_H;
      tries++;
    }
  })();

  // ---------- INPUT: BÀN PHÍM ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    // e.repeat = true khi trình duyệt tự lặp lại phím do GIỮ phím (không phải bấm mới)
    // -> bỏ qua để giữ phím "e" không đập/đào liên tục không dừng
    if (e.key.toLowerCase() === 'l' && !e.repeat) tryInteract();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function keyboardVector() {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    return { dx, dy };
  }

  // ---------- INPUT: JOYSTICK ẢO (MOBILE) ----------
  const joyZone = document.getElementById('joyZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  let joyActive = false, joyVec = {dx:0,dy:0};
  const JOY_RADIUS = 50;

  function joyCenter() {
    const r = joyBase.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }

  function joyStart(clientX, clientY) {
    joyActive = true;
    joyMove(clientX, clientY);
  }
  function joyMove(clientX, clientY) {
    if (!joyActive) return;
    const c = joyCenter();
    let dx = clientX - c.x;
    let dy = clientY - c.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }

    // Khi #rotateRoot đang bị xoay 90° (chế độ ép ngang trên điện thoại),
    // clientX/clientY vẫn là toạ độ THẬT (chưa xoay) của ngón tay, nên phải
    // xoay ngược lại cho khớp hướng hiển thị trên màn hình đã xoay —
    // áp dụng cho CẢ vị trí hiển thị của núm joystick lẫn vector di chuyển.
    let vx = dx / JOY_RADIUS, vy = dy / JOY_RADIUS;
    let displayDx = dx, displayDy = dy;
    if (rotateRoot.classList.contains('forced-landscape')) {
      const rvx = vy;
      const rvy = -vx;
      vx = rvx; vy = rvy;
      displayDx = vx * JOY_RADIUS;
      displayDy = vy * JOY_RADIUS;
    }

    joyStick.style.transform = `translate(calc(-50% + ${displayDx}px), calc(-50% + ${displayDy}px))`;
    joyVec = { dx: vx, dy: vy };
  }
  function joyEnd() {
    joyActive = false;
    joyStick.style.transform = 'translate(-50%,-50%)';
    joyVec = { dx:0, dy:0 };
  }

  joyZone.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    joyStart(t.clientX, t.clientY);
  }, {passive:true});
  joyZone.addEventListener('touchmove', e => {
    const t = e.changedTouches[0];
    joyMove(t.clientX, t.clientY);
  }, {passive:true});
  joyZone.addEventListener('touchend', joyEnd);
  joyZone.addEventListener('touchcancel', joyEnd);

  // hỗ trợ chuột kéo cho test trên desktop
  joyZone.addEventListener('mousedown', e => joyStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => { if (joyActive) joyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', joyEnd);

  document.getElementById('interactBtn').addEventListener('touchstart', e => {
    e.preventDefault(); tryInteract();
  });
  document.getElementById('interactBtn').addEventListener('click', tryInteract);

  // ---------- TƯƠNG TÁC ----------
  const msgBox = document.getElementById('msgBox');
  let msgTimer = null;

  function showMessage(text, duration=2500) {
    msgBox.textContent = text;
    msgBox.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgBox.style.display = 'none'; }, duration);
  }

  function tryInteract() {
    // Ưu tiên -1: nếu đang trong minigame câu cá, nút "Dùng" dùng để bắt nhịp
    if (fishTapHandler) { fishTapHandler(); return; }

    // Ưu tiên 0: câu cá nếu đang cầm cần câu và đứng gần mặt nước
    if (equipped === 'rod' && isNearWater(player.x, player.y)) { doFishing(); return; }

    // Ưu tiên 0.5: ô đất nông trại gần nhất (trồng / thu hoạch)
    let nearestPlot = null, nearestPlotD = 999999;
    for (const p of FARM_PLOTS) {
      const d = Math.hypot(player.x - p.x, player.y - p.y);
      if (d < 34 && d < nearestPlotD) { nearestPlotD = d; nearestPlot = p; }
    }
    if (nearestPlot) {
      const status = farmPlotStatus(nearestPlot.idx);
      if (status.state === 'empty') { plantAt(nearestPlot.idx); }
      else if (status.state === 'ready') { harvestAt(nearestPlot.idx); }
      else {
        const meta = CROP_META[status.seed];
        const left = Math.max(0, Math.ceil(meta.growTime * (1 - status.progress)));
        showMessage(`${ITEM_META[status.seed].icon} Đang lớn... còn ~${left}s`, 1300);
      }
      return;
    }

    // Ưu tiên 1: tài nguyên (cây/đá) gần nhất trong tầm tay
    let nearestNode = null, nearestD = 999999;
    for (const node of resourceNodes) {
      if (!node.alive) continue;
      const d = Math.hypot(player.x - node.x, player.y - node.y);
      if (d < 46 && d < nearestD) { nearestD = d; nearestNode = node; }
    }
    if (nearestNode) { gatherNode(nearestNode); return; }

    // Ưu tiên 2: cửa hàng / NPC / cổng
    for (const obj of interactables) {
      const d = Math.hypot(player.x - obj.x, player.y - obj.y);
      if (d < obj.r + 34) {
        if (obj.type === 'shop') { openShop(); return; }
        showMessage(obj.msg);
        return;
      }
    }

    if (equipped === 'rod') showMessage('🎣 Cần đứng gần mặt nước để câu cá!', 1400);
  }

  // ---------- CÂU CÁ ----------
  function isNearWater(px, py) {
    // kiểm tra 8 hướng quanh nhân vật (bán kính ~1.3 tile) xem có tile nước không
    const R = TILE * 1.3;
    for (let a = 0; a < 8; a++) {
      const ang = a / 8 * Math.PI * 2;
      const tx = Math.floor((px + Math.cos(ang)*R) / TILE);
      const ty = Math.floor((py + Math.sin(ang)*R) / TILE);
      if (tx>=0 && ty>=0 && tx<WORLD_COLS && ty<WORLD_ROWS && worldMap[ty][tx] === 1) return true;
    }
    return false;
  }

  let fishing = false;
  const fishGameEl = document.getElementById('fishGame');
  const fishBarWrapEl = document.getElementById('fishBarWrap');
  const fishZoneEl = document.getElementById('fishZone');
  const fishCursorEl = document.getElementById('fishCursor');
  const fishHintEl = document.getElementById('fishHint');
  const fishProgEl = document.getElementById('fishProg');
  let fishAnim = null;
  let fishTapHandler = null; // khi khác null: nút "Dùng" sẽ bắt nhịp câu cá thay vì tương tác thường

  // Đặt thanh câu cá thu nhỏ ngay phía trên ô cần câu trong hotbar cho gọn.
  // Lưu ý: #gameFrame có thể bị xoay 90° (chế độ ép ngang trên điện thoại),
  // nên phải tính theo tọa độ offset cục bộ (offsetLeft/offsetTop) thay vì
  // getBoundingClientRect (tọa độ màn hình sau khi xoay) để không bị lệch.
  function offsetWithin(el, ancestor) {
    let x = 0, y = 0, cur = el;
    while (cur && cur !== ancestor) {
      x += cur.offsetLeft;
      y += cur.offsetTop;
      cur = cur.offsetParent;
    }
    return { x, y };
  }
  // Đặt thanh câu cá NGAY TRÊN ĐẦU nhân vật trong thế giới (không phải trên hotbar),
  // dùng tọa độ camera giống hệt lúc vẽ nhân vật trên canvas, rồi quy đổi từ độ phân
  // giải canvas (960x540 cố định) sang px CSS thực tế (canvas có thể bị co giãn theo màn hình).
  function positionFishGameOverPlayer() {
    const frame = document.getElementById('gameFrame');
    if (!frame || !canvas) return;
    const scaleX = canvas.clientWidth / canvas.width;
    const scaleY = canvas.clientHeight / canvas.height;
    const canvasOff = offsetWithin(canvas, frame);
    const sx = (player.x - camera.x) * scaleX + canvasOff.x;
    const sy = (player.y - camera.y) * scaleY + canvasOff.y;
    // neo tâm-dưới của khung ngay phía trên đầu nhân vật (translate(-50%,-100%) trong CSS lo phần căn giữa)
    fishGameEl.style.left = sx + 'px';
    fishGameEl.style.top = (sy - 34) + 'px';
    fishGameEl.style.bottom = '';
  }

  function doFishing() {
    if (fishing) return;
    fishing = true;
    showMessage('🎣 Đang thả câu... chờ cá cắn câu!', 1600);
    const waitTime = 1200 + Math.random()*2000;
    setTimeout(() => {
      if (!fishing) return; // người chơi đã bỏ đi / hủy
      startFishMinigame();
    }, waitTime);
  }

  function startFishMinigame() {
    fishGameEl.style.display = 'flex';
    positionFishGameOverPlayer();
    const barW = fishBarWrapEl.clientWidth;

    let requiredHits = 3;   // số lần bấm trúng cần để câu được cá
    let currentHits = 0;
    let missCount = 0;
    const maxMisses = 3;    // trượt quá số lần này thì cá sổng

    let zoneStart = 0, zoneW = 0; // px
    let pos = 0, dir = 1;
    const speed = barW * (0.55 + Math.random() * 0.25); // px/giây, tỉ lệ theo chiều rộng thanh để tốc độ luôn vừa phải
    let last = performance.now();
    let escapeTimer = null;
    let ended = false;

    function randomizeZone() {
      zoneW = barW * (0.18 + Math.random()*0.08); // vùng xanh ~18-26% chiều rộng
      zoneStart = Math.random() * (barW - zoneW);
      fishZoneEl.style.width = zoneW + 'px';
      fishZoneEl.style.left = zoneStart + 'px';
    }
    randomizeZone();
    fishCursorEl.style.left = '0px';
    fishProgEl.style.width = '0%';
    fishHintEl.textContent = `🎣 Bấm "Dùng" đúng lúc! (0/${requiredHits})`;

    function updateProg() {
      fishProgEl.style.width = Math.round((currentHits/requiredHits)*100) + '%';
    }

    function tapHandler(e) {
      if (e) e.preventDefault();
      if (ended) return;
      const inZone = pos >= zoneStart && pos <= zoneStart + zoneW;
      if (inZone) {
        currentHits++;
        updateProg();
        if (typeof sfx !== 'undefined') sfx.fishHit();
        if (currentHits >= requiredHits) { endFishMinigame(true); return; }
        fishHintEl.textContent = `✅ Đúng nhịp! (${currentHits}/${requiredHits})`;
        randomizeZone(); // đổi vị trí vùng xanh cho lượt kéo tiếp theo
      } else {
        currentHits = Math.max(0, currentHits - 1);
        updateProg();
        missCount++;
        if (typeof sfx !== 'undefined') sfx.error();
        fishHintEl.textContent = `❌ Nhấn lệch nhịp! Cẩn thận, cá sắp sổng (${currentHits}/${requiredHits})`;
        if (missCount >= maxMisses) { endFishMinigame(false); return; }
      }
    }
    window.addEventListener('keydown', spaceHandler);
    fishTapHandler = tapHandler; // nút "Dùng" sẽ gọi hàm này để bắt nhịp
    function spaceHandler(e) {
      if (e.code === 'Space' || e.key === 'Enter') tapHandler(e);
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      pos += dir * speed * dt;
      if (pos < 0) { pos = 0; dir = 1; }
      if (pos > barW) { pos = barW; dir = -1; }
      fishCursorEl.style.left = pos + 'px';
      positionFishGameOverPlayer(); // bám theo đầu nhân vật nếu camera/nhân vật di chuyển
      fishAnim = requestAnimationFrame(frame);
    }
    fishAnim = requestAnimationFrame(frame);

    // nếu câu quá lâu mà chưa đủ số lần trúng, cá tự sổng
    escapeTimer = setTimeout(() => { endFishMinigame(false); }, 9000);

    function endFishMinigame(win) {
      if (ended) return;
      ended = true;
      cancelAnimationFrame(fishAnim);
      clearTimeout(escapeTimer);
      window.removeEventListener('keydown', spaceHandler);
      fishTapHandler = null;
      fishGameEl.style.display = 'none';
      fishing = false;
      wearTool('rod');
      if (equipped !== 'rod') return; // cần câu vừa hỏng giữa chừng
      if (win) {
        const n = 1; // luôn chỉ 1 con mỗi lần câu
        addItem('fish', n);
        showMessage(`🐟 Câu được ${n} con Cá!`, 1600);
        if (typeof sfx !== 'undefined') sfx.fishWin();
      } else {
        showMessage('💨 Cá đã sổng mất, thử lại nhé!', 1400);
        if (typeof sfx !== 'undefined') sfx.error();
      }
    }
  }

  // hao mòn độ bền công cụ đang cầm; công cụ hỏng khi độ bền về 0
  function wearTool(id) {
    if (equipped !== id || !(playerTools[id] > 0)) return;
    playerTools[id] -= 1;
    if (playerTools[id] <= 0) {
      playerTools[id] = 0;
      breakEquippedTool();
    } else {
      renderHotbar();
    }
    if (typeof scheduleSave === 'function') scheduleSave();
  }

  // Khoảng cách tối thiểu giữa 2 lần chặt cây / đào đá liên tiếp (mili-giây)
  const GATHER_COOLDOWN_MS = 750;
  let lastGatherAt = 0;
  function gatherNode(node) {
    const now = Date.now();
    if (now - lastGatherAt < GATHER_COOLDOWN_MS) return; // còn trong thời gian hồi chiêu, bỏ qua
    lastGatherAt = now;

    const style = RESOURCE_STYLE[node.type];
    const usingRightTool = (node.type === 'wood' && equipped === 'axe') || (node.type === 'stone' && equipped === 'pickaxe');
    // Không dụng cụ: cây 5 lần (hp15/dmg3), đá 6 lần (hp12/dmg2)
    // Có dụng cụ: cây 3 lần (dmg5), đá 4 lần (dmg3)
    let dmg;
    if (usingRightTool) {
      dmg = node.type === 'wood' ? 5 : 3;
    } else {
      dmg = node.type === 'wood' ? 3 : 2;
    }
    node.hp -= dmg;
    spawnChopFx(node.x, node.y);
    if (node.type === 'wood') sfx.chop(); else sfx.mine();

    if (node.hp <= 0) {
      node.alive = false;
      node.respawnAt = Date.now() + style.respawn * 1000;
      const n = style.amount[0] + Math.floor(Math.random() * (style.amount[1]-style.amount[0]+1));
      addItem(style.give, n);
      sfx.pickup();
      showMessage(`${style.icon} Nhận ${n} ${style.giveIcon} ${style.giveName}!`, 1400);
      // Chỉ trừ 1 độ bền khi chặt/đào hết 1 cây hoặc 1 đá
      if (usingRightTool) wearTool(node.type === 'wood' ? 'axe' : 'pickaxe');
      // Báo cho MỌI người chơi khác biết node này vừa hết -> họ cũng không thấy nữa
      broadcastNodeGathered(node);
    }
  }

  // hiệu ứng hạt vụn nhỏ khi chặt/đào
  const chopFx = [];
  function spawnChopFx(x, y) {
    for (let i = 0; i < 6; i++) {
      chopFx.push({
        x, y,
        vx: (Math.random()-0.5) * 120,
        vy: -60 - Math.random()*60,
        life: 0.5
      });
    }
  }
  function updateChopFx(dt) {
    for (let i = chopFx.length-1; i >= 0; i--) {
      const p = chopFx[i];
      p.life -= dt;
      if (p.life <= 0) { chopFx.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 220*dt;
    }
  }
  function drawChopFx() {
    for (const p of chopFx) {
      ctx.globalAlpha = Math.max(0, p.life/0.5);
      ctx.fillStyle = '#c9a15a';
      ctx.fillRect(p.x-camera.x-2, p.y-camera.y-2, 4, 4);
      ctx.globalAlpha = 1;
    }
  }

  function updateResourceNodes() {
    const now = Date.now();
    for (const node of resourceNodes) {
      if (!node.alive && now >= node.respawnAt) {
        node.alive = true;
        node.hp = node.maxHp;
        broadcastNodeRespawned(node);
      }
    }
  }

  function drawResourceNodes() {
    for (const node of resourceNodes) {
      const sx = node.x - camera.x, sy = node.y - camera.y;
      if (sx < -40 || sy < -40 || sx > canvas.width+40 || sy > canvas.height+40) continue;
      const style = RESOURCE_STYLE[node.type];

      if (!node.alive) {
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.globalAlpha = 0.5;
        ctx.fillText(style.deadIcon, sx, sy+8);
        ctx.globalAlpha = 1;
        continue;
      }

      ctx.font = node.type === 'wood' ? '30px Arial' : '24px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(style.icon, sx, sy+10);

      // thanh máu khi đã bị đánh
      if (node.hp < node.maxHp) {
        const bw = 28;
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(sx-bw/2, sy-26, bw, 5);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(sx-bw/2, sy-26, bw*(node.hp/node.maxHp), 5);
      }

      // vòng gợi ý khi đứng gần
      const d = Math.hypot(player.x - node.x, player.y - node.y);
      if (d < 46) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.setLineDash([4,4]);
        ctx.arc(sx, sy, 26, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function drawFarmPlots() {
    for (const p of FARM_PLOTS) {
      const sx = p.x - camera.x, sy = p.y - camera.y;
      if (sx < -40 || sy < -40 || sx > canvas.width+40 || sy > canvas.height+40) continue;
      const status = farmPlotStatus(p.idx);

      if (status.state === 'growing' || status.state === 'ready') {
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.globalAlpha = status.state === 'ready' ? 1 : (0.55 + status.progress*0.45);
        ctx.fillText(status.state === 'ready' ? '✅' : ITEM_META[status.seed].icon, sx, sy+7);
        ctx.globalAlpha = 1;

        if (status.state === 'growing') {
          const bw = 26;
          ctx.fillStyle = 'rgba(0,0,0,.5)';
          ctx.fillRect(sx-bw/2, sy-20, bw, 4);
          ctx.fillStyle = '#8bc34a';
          ctx.fillRect(sx-bw/2, sy-20, bw*status.progress, 4);
        }
      }

      const d = Math.hypot(player.x - p.x, player.y - p.y);
      if (d < 34) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.setLineDash([4,4]);
        ctx.arc(sx, sy, 20, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }


  // ---------- CAMERA ----------
  const camera = { x:0, y:0 };
  function updateCamera() {
    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;
    camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, camera.y));
  }

  // ---------- VÒNG LẶP GAME ----------
  let lastTime = performance.now();

  function update(dt) {
    // gộp input bàn phím + joystick
    const kv = keyboardVector();
    let dx = kv.dx + joyVec.dx;
    let dy = kv.dy + joyVec.dy;
    const len = Math.hypot(dx, dy);
    if (len > 0.001) {
      dx /= len; dy /= len;

      // xác định hướng cho animation
      if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
      else player.dir = dy > 0 ? 'down' : 'up';

      const moveX = dx * player.speed * dt;
      const moveY = dy * player.speed * dt;

      // di chuyển trục X rồi kiểm tra va chạm riêng biệt (trượt theo tường)
      const nextX = player.x + moveX;
      if (!isSolidAtWorld(nextX + Math.sign(moveX)*player.w/2, player.y - player.h/3) &&
          !isSolidAtWorld(nextX + Math.sign(moveX)*player.w/2, player.y + player.h/3)) {
        player.x = Math.max(player.w/2, Math.min(WORLD_W - player.w/2, nextX));
      }
      const nextY = player.y + moveY;
      if (!isSolidAtWorld(player.x, nextY + Math.sign(moveY)*player.h/2)) {
        player.y = Math.max(player.h/2, Math.min(WORLD_H - player.h/2, nextY));
      }

      player.frameTimer += dt;
      if (player.frameTimer > 0.12) { player.frame = (player.frame+1) % 4; player.frameTimer = 0; }
      broadcastPosition();
    } else {
      player.frame = 0;
    }

    updateCamera();
    updateChopFx(dt);
    updateResourceNodes();
  }

  function drawWorld() {
    const startCol = Math.floor(camera.x / TILE);
    const endCol   = Math.ceil((camera.x + canvas.width) / TILE);
    const startRow = Math.floor(camera.y / TILE);
    const endRow   = Math.ceil((camera.y + canvas.height) / TILE);

    for (let ty = startRow; ty < endRow; ty++) {
      for (let tx = startCol; tx < endCol; tx++) {
        if (tx < 0 || ty < 0 || tx >= WORLD_COLS || ty >= WORLD_ROWS) continue;
        const type = worldMap[ty][tx];
        ctx.fillStyle = TILE_COLORS[type];
        const sx = tx*TILE - camera.x;
        const sy = ty*TILE - camera.y;
        ctx.fillRect(sx, sy, TILE, TILE);

        // viền nhẹ để phân biệt tile (tùy chọn, có thể bỏ để nhìn mượt hơn)
        ctx.strokeStyle = 'rgba(0,0,0,0.04)';
        ctx.strokeRect(sx, sy, TILE, TILE);
      }
    }
  }

  function drawInteractables() {
    for (const obj of interactables) {
      const sx = obj.x - camera.x;
      const sy = obj.y - camera.y;
      if (sx < -50 || sy < -50 || sx > canvas.width+50 || sy > canvas.height+50) continue;

      ctx.beginPath();
      ctx.fillStyle = obj.color;
      ctx.arc(sx, sy, 22, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (obj.icon) {
        ctx.font = '22px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(obj.icon, sx, sy+8);
      }

      ctx.fillStyle = '#fff';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(obj.name, sx, sy - 30);

      // vòng tương tác gợi ý khi gần
      const d = Math.hypot(player.x - obj.x, player.y - obj.y);
      if (d < obj.r + 34) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.setLineDash([4,4]);
        ctx.arc(sx, sy, obj.r+34, 0, Math.PI*2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.fillText('Nhấn L / Dùng', sx, sy + obj.r + 46);
      }
    }
  }

  function drawPlayer() {
    const sx = player.x - camera.x;
    const sy = player.y - camera.y;

    // bóng đổ
    ctx.beginPath();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.ellipse(sx, sy + player.h/2 - 2, player.w/2.4, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // thân nhân vật (hình chữ nhật bo góc đơn giản, dễ thay bằng sprite sau)
    ctx.fillStyle = '#ffcc66';
    roundRect(ctx, sx - player.w/2, sy - player.h/2, player.w, player.h, 6);
    ctx.fill();

    // mắt / hướng nhìn
    ctx.fillStyle = '#333';
    const eyeOffset = { up:[-5,-9,5,-9], down:[-5,3,5,3], left:[-8,-2,-2,-2], right:[2,-2,8,-2] }[player.dir];
    ctx.fillRect(sx+eyeOffset[0]-2, sy+eyeOffset[1]-2, 4, 4);
    ctx.fillRect(sx+eyeOffset[2]-2, sy+eyeOffset[3]-2, 4, 4);

    // hiệu ứng bước chân nhẹ khi di chuyển
    if (player.frame % 2 === 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(sx, sy + player.h/2, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // vẽ những người chơi khác đang ở chung thế giới (realtime)
  function drawOtherPlayers() {
    const now = Date.now();
    for (const id in otherPlayers) {
      const p = otherPlayers[id];
      if (!p || typeof p.x !== 'number' || typeof p.y !== 'number') continue;
      if (p.t && now - p.t > 20000) continue; // dữ liệu quá cũ (có thể đã thoát), bỏ qua

      const sx = p.x - camera.x;
      const sy = p.y - camera.y;
      if (sx < -60 || sy < -60 || sx > canvas.width+60 || sy > canvas.height+60) continue;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.ellipse(sx, sy + player.h/2 - 2, player.w/2.4, 6, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#66ccff';
      roundRect(ctx, sx - player.w/2, sy - player.h/2, player.w, player.h, 6);
      ctx.fill();

      ctx.fillStyle = '#222';
      const dir = p.dir || 'down';
      const eyeOffset = { up:[-5,-9,5,-9], down:[-5,3,5,3], left:[-8,-2,-2,-2], right:[2,-2,8,-2] }[dir];
      ctx.fillRect(sx+eyeOffset[0]-2, sy+eyeOffset[1]-2, 4, 4);
      ctx.fillRect(sx+eyeOffset[2]-2, sy+eyeOffset[3]-2, 4, 4);

      ctx.fillStyle = '#fff';
      ctx.font = '11px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(p.name || id, sx, sy - player.h/2 - 8);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawMinimap() {
    miniCtx.clearRect(0,0,miniCanvas.width, miniCanvas.height);
    const scaleX = miniCanvas.width / WORLD_W;
    const scaleY = miniCanvas.height / WORLD_H;

    for (let ty = 0; ty < WORLD_ROWS; ty += 2) {
      for (let tx = 0; tx < WORLD_COLS; tx += 2) {
        miniCtx.fillStyle = TILE_COLORS[worldMap[ty][tx]];
        miniCtx.fillRect(tx*TILE*scaleX, ty*TILE*scaleY, TILE*scaleX*2, TILE*scaleY*2);
      }
    }

    // chấm nhỏ tài nguyên còn sống trên minimap
    for (const node of resourceNodes) {
      if (!node.alive) continue;
      miniCtx.fillStyle = node.type === 'wood' ? '#2e7d32' : '#bdbdbd';
      miniCtx.fillRect(node.x*scaleX-1, node.y*scaleY-1, 2, 2);
    }

    // vị trí những người chơi khác đang ở chung thế giới
    const nowMini = Date.now();
    miniCtx.fillStyle = '#66ccff';
    for (const id in otherPlayers) {
      const p = otherPlayers[id];
      if (!p || typeof p.x !== 'number') continue;
      if (p.t && nowMini - p.t > 20000) continue;
      miniCtx.beginPath();
      miniCtx.arc(p.x*scaleX, p.y*scaleY, 2.5, 0, Math.PI*2);
      miniCtx.fill();
    }

    // vị trí người chơi
    miniCtx.fillStyle = '#ff2222';
    miniCtx.beginPath();
    miniCtx.arc(player.x*scaleX, player.y*scaleY, 3, 0, Math.PI*2);
    miniCtx.fill();

    // khung camera hiện tại
    miniCtx.strokeStyle = 'rgba(255,255,255,0.8)';
    miniCtx.strokeRect(camera.x*scaleX, camera.y*scaleY, canvas.width*scaleX, canvas.height*scaleY);
  }

  function render() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    drawWorld();
    drawFarmPlots();
    drawResourceNodes();
    drawInteractables();
    drawOtherPlayers();
    drawPlayer();
    drawChopFx();
    drawMinimap();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Dùng chung localStorage với trang đăng nhập (auth.html)
  const CHAT_LS_KEY = 'world_login';
  function toKey(name) {
    return name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, '_');
  }

  let myId = '';    // tên hiển thị (giống trang chat)
  let myKey = '';   // key an toàn dùng làm đường dẫn Firebase
  let saveRef = null;
  // Chỉ cho phép lưu sau khi đã tải xong (hoặc xác nhận chưa có save),
  // tránh ghi đè tiến trình thật bằng dữ liệu mặc định khi vừa vào game.
  let progressReady = false;

  const LOCAL_SAVE_PREFIX = 'game_ow_save_v2_';

  function readLocalSave(key) {
    if (!key) return null;
    try {
      const raw = localStorage.getItem(LOCAL_SAVE_PREFIX + key);
      if (!raw) return null;
      const data = JSON.parse(raw);
      return data && typeof data === 'object' ? data : null;
    } catch (e) {
      return null;
    }
  }

  function writeLocalSave(key, payload) {
    if (!key || !payload) return;
    try {
      localStorage.setItem(LOCAL_SAVE_PREFIX + key, JSON.stringify(payload));
    } catch (e) {}
  }

  function buildSavePayload() {
    return {
      inventory: Object.assign({}, inventory),
      tools: Object.assign({}, playerTools),
      farm: JSON.parse(JSON.stringify(farmPlots)),
      pos: { x: player.x, y: player.y },
      updatedAt: Date.now()
    };
  }

  function applySaveData(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.inventory && typeof data.inventory === 'object') {
      Object.keys(inventory).forEach(k => delete inventory[k]);
      Object.assign(inventory, data.inventory);
    }
    if (data.tools && typeof data.tools === 'object') {
      playerTools.axe = 0;
      playerTools.pickaxe = 0;
      playerTools.rod = 0;
      Object.assign(playerTools, data.tools);
    }
    if (data.farm && typeof data.farm === 'object') {
      Object.keys(farmPlots).forEach(k => delete farmPlots[k]);
      Object.assign(farmPlots, data.farm);
    }
    // dọn vật phẩm cũ không còn dùng
    ['fiber','seed_corn','seed_potato','axe','pickaxe','rod'].forEach(k => delete inventory[k]);
    if (data.pos && typeof data.pos.x === 'number' && typeof data.pos.y === 'number') {
      player.x = data.pos.x;
      player.y = data.pos.y;
    }
    return true;
  }

  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      let left = false;
      const goBack = () => {
        if (left) return;
        left = true;
        window.location.href = '/world';
      };
      // Luôn ghi localStorage đồng bộ trước khi rời trang (không phụ thuộc mạng)
      if (progressReady && myKey) {
        clearTimeout(saveDebounceTimer);
        writeLocalSave(myKey, buildSavePayload());
      }
      if (!saveRef || !progressReady) { goBack(); return; }
      saveProgress().then(goBack).catch(goBack);
      setTimeout(goBack, 3000);
    });
  }

  // Đăng nhập bằng tài khoản đã đăng nhập ở auth.html (đọc localStorage chung).
  // Nếu chưa đăng nhập thì quay lại trang đăng nhập.
  (async function initFromChatAccount() {
    const savedName = localStorage.getItem(CHAT_LS_KEY);
    if (!savedName) {
      window.location.href = '/world';
      return;
    }
    const key = toKey(savedName);
    try {
      const userRef = db.ref('chat_users').child(key);
      const snap = await userRef.get();
      if (!snap.exists()) {
        // Tạo bản ghi user nếu chưa có (đăng ký từ auth.html)
        await userRef.set({
          displayName: savedName,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        });
      }
      const data = snap.exists() ? snap.val() : { displayName: savedName };
      myId = data.displayName || savedName;
      myKey = key;
      document.getElementById('playerTag').textContent = '👤 ' + myId;
      saveRef = db.ref('game_open_world/' + myKey);
      loadProgress();
      initMultiplayer();
    } catch (e) {
      console.error(e);
      // Vẫn cho vào game nếu chỉ lỗi mạng, miễn là đã có localStorage
      myId = savedName;
      myKey = key;
      document.getElementById('playerTag').textContent = '👤 ' + myId;
      saveRef = db.ref('game_open_world/' + myKey);
      loadProgress();
      initMultiplayer();
    }
  })();

  function loadProgress() {
    const localData = readLocalSave(myKey);

    const finish = (data, fromLabel) => {
      const ok = applySaveData(data);
      renderInventory();
      renderHotbar();
      progressReady = true;
      if (ok) {
        showMessage('☁️ Đã tải tiến trình' + (fromLabel ? ' (' + fromLabel + ')' : ''), 1600);
        // Đồng bộ bản đã chọn lên cả local + Firebase
        saveProgress();
      }
    };

    if (!saveRef) {
      finish(localData, localData ? 'máy' : '');
      return;
    }

    // Timeout: nếu Firebase chậm >2.5s thì dùng local trước
    let settled = false;
    const localFallbackTimer = setTimeout(() => {
      if (settled) return;
      settled = true;
      finish(localData, localData ? 'máy' : '');
    }, 2500);

    saveRef.once('value').then(snap => {
      if (settled) {
        // Đã dùng local rồi; nếu Firebase mới hơn thì áp dụng lại
        const remote = snap.exists() ? (snap.val() || null) : null;
        if (remote && localData) {
          const rt = Number(remote.updatedAt) || 0;
          const lt = Number(localData.updatedAt) || 0;
          if (rt > lt) {
            applySaveData(remote);
            renderInventory();
            renderHotbar();
            writeLocalSave(myKey, buildSavePayload());
          }
        } else if (remote && !localData) {
          applySaveData(remote);
          renderInventory();
          renderHotbar();
          writeLocalSave(myKey, buildSavePayload());
        }
        return;
      }
      settled = true;
      clearTimeout(localFallbackTimer);
      const remote = snap.exists() ? (snap.val() || null) : null;
      let chosen = null;
      let label = '';
      if (remote && localData) {
        const rt = Number(remote.updatedAt) || 0;
        const lt = Number(localData.updatedAt) || 0;
        if (lt > rt) {
          chosen = localData;
          label = 'máy';
        } else {
          chosen = remote;
          label = 'cloud';
        }
      } else {
        chosen = remote || localData;
        label = remote ? 'cloud' : (localData ? 'máy' : '');
      }
      finish(chosen, label);
    }).catch(() => {
      if (settled) return;
      settled = true;
      clearTimeout(localFallbackTimer);
      finish(localData, localData ? 'máy' : '');
    });
  }

  function saveProgress() {
    if (!myKey || !progressReady) return Promise.resolve();
    const payload = buildSavePayload();
    // localStorage ghi đồng bộ — sống sót khi đóng tab / mất mạng
    writeLocalSave(myKey, payload);
    if (!saveRef) return Promise.resolve();
    return saveRef.set({
      inventory: payload.inventory,
      tools: payload.tools,
      farm: payload.farm,
      pos: payload.pos,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(()=>{});
  }

  // Lưu ngay (debounce ~0.4s) mỗi khi túi đồ / công cụ / nông trại đổi
  let saveDebounceTimer = null;
  function scheduleSave() {
    if (!myKey || !progressReady) return;
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(() => { saveProgress(); }, 400);
  }

  // tự động lưu định kỳ + khi rời trang / ẩn tab
  setInterval(saveProgress, 4000);
  window.addEventListener('beforeunload', () => { saveProgress(); });
  window.addEventListener('pagehide', () => { saveProgress(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

  // ---------- THẾ GIỚI CHUNG (MULTIPLAYER REALTIME) ----------
  // Tất cả tài khoản khi vào game đều đứng chung 1 phòng "main",
  // thấy nhau di chuyển realtime qua Firebase Realtime Database.
  const WORLD_ROOM_ID = 'main';
  let playersRef = null;
  let myPlayerRef = null;
  const otherPlayers = {}; // id khác -> {x,y,dir,name,t}
  let lastSentX = null, lastSentY = null, lastSentDir = null, lastSendTime = 0;

  function initMultiplayer() {
    if (!myKey || playersRef) return;
    playersRef = db.ref('game_open_world_room/' + WORLD_ROOM_ID + '/players');
    myPlayerRef = playersRef.child(myKey);

    // tự xoá mình khỏi phòng nếu mất kết nối / đóng tab
    myPlayerRef.onDisconnect().remove();

    playersRef.on('child_added', snap => {
      if (snap.key === myKey) return;
      otherPlayers[snap.key] = snap.val();
    });
    playersRef.on('child_changed', snap => {
      if (snap.key === myKey) return;
      otherPlayers[snap.key] = snap.val();
    });
    playersRef.on('child_removed', snap => {
      delete otherPlayers[snap.key];
    });

    initChat();
    initNodesSync();
  }

  // ---------- ĐỒNG BỘ CÂY / ĐÁ DÙNG CHUNG CHO MỌI NGƯỜI CHƠI ----------
  // Bản đồ + vị trí node được sinh CỐ ĐỊNH (seed) nên node.id trùng nhau trên mọi máy.
  // Khi 1 người phá xong 1 cây/đá, trạng thái "đã mất + giờ hồi" được ghi lên Firebase
  // để tất cả người chơi khác thấy nó biến mất ngay lập tức, và tự hồi lại đúng giờ.
  let nodesRef = null;
  function initNodesSync() {
    if (!myKey || nodesRef) return;
    nodesRef = db.ref('game_open_world_room/' + WORLD_ROOM_ID + '/nodes');
    nodesRef.on('child_added', snap => applyNodeState(snap.key, snap.val()));
    nodesRef.on('child_changed', snap => applyNodeState(snap.key, snap.val()));
    nodesRef.on('child_removed', snap => applyNodeState(snap.key, null));
  }
  function applyNodeState(id, val) {
    const node = resourceNodes[id];
    if (!node) return;
    if (val && val.alive === false) {
      node.alive = false;
      node.hp = 0;
      node.respawnAt = typeof val.respawnAt === 'number'
        ? val.respawnAt
        : Date.now() + RESOURCE_STYLE[node.type].respawn * 1000;
    } else if (!node.alive) {
      // Bản ghi đã bị xoá (ai đó xác nhận đã hồi) -> hồi lại tại chỗ nếu chưa hồi
      node.alive = true;
      node.hp = node.maxHp;
    }
  }
  function broadcastNodeGathered(node) {
    if (!nodesRef) return;
    nodesRef.child(String(node.id)).set({ alive:false, respawnAt: node.respawnAt }).catch(()=>{});
  }
  function broadcastNodeRespawned(node) {
    if (!nodesRef) return;
    nodesRef.child(String(node.id)).remove().catch(()=>{});
  }

  // ---------- CHAT CHUNG (BONG BÓNG GÓC MÀN HÌNH) ----------
  let chatRef = null;
  let chatLoaded = false; // để không hiện chấm đỏ với các tin nhắn cũ tải lần đầu
  const chatBubbleEl = document.getElementById('chatBubble');
  const chatDotEl = chatBubbleEl.querySelector('.chatDot');
  const chatPanelEl = document.getElementById('chatPanel');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatInputEl = document.getElementById('chatInput');
  const chatSendBtnEl = document.getElementById('chatSendBtn');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
  }

  function appendChatMessage(msg) {
    if (!msg) return;
    const div = document.createElement('div');
    div.className = 'chatMsg';
    div.innerHTML = `<b>${escapeHtml(msg.name || '?')}:</b> ${escapeHtml(msg.text || '')}`;
    chatMessagesEl.appendChild(div);
    while (chatMessagesEl.children.length > 40) chatMessagesEl.removeChild(chatMessagesEl.firstChild);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    if (chatLoaded && chatPanelEl.style.display !== 'flex') {
      chatDotEl.style.display = 'block';
    }
  }

  function initChat() {
    if (chatRef) return;
    chatRef = db.ref('game_open_world_room/' + WORLD_ROOM_ID + '/chat');
    chatRef.limitToLast(30).on('child_added', snap => {
      appendChatMessage(snap.val());
    });
    setTimeout(() => { chatLoaded = true; }, 1200); // tránh nháy chấm đỏ với lịch sử cũ
  }

  function sendChatMessage() {
    const text = chatInputEl.value.trim();
    if (!text || !chatRef || !myKey) return;
    chatRef.push({
      name: myId,
      text: text.slice(0, 150),
      t: firebase.database.ServerValue.TIMESTAMP
    });
    chatInputEl.value = '';
  }

  function toggleChat() {
    const open = chatPanelEl.style.display === 'flex';
    chatPanelEl.style.display = open ? 'none' : 'flex';
    if (!open) {
      chatDotEl.style.display = 'none';
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }
  }

  chatBubbleEl.addEventListener('click', toggleChat);
  chatBubbleEl.addEventListener('touchstart', e => { e.preventDefault(); toggleChat(); });
  chatSendBtnEl.addEventListener('click', sendChatMessage);
  chatInputEl.addEventListener('keydown', e => {
    e.stopPropagation(); // không để phím gõ chat điều khiển nhân vật di chuyển
    if (e.key === 'Enter') sendChatMessage();
  });
  chatInputEl.addEventListener('keyup', e => e.stopPropagation());

  function broadcastPosition(force) {
    if (!myPlayerRef) return;
    const now = performance.now();
    if (!force) {
      if (now - lastSendTime < 120) return; // giới hạn tần suất gửi lên server
      if (player.x === lastSentX && player.y === lastSentY && player.dir === lastSentDir) return;
    }
    lastSentX = player.x; lastSentY = player.y; lastSentDir = player.dir;
    lastSendTime = now;
    myPlayerRef.set({
      x: player.x, y: player.y, dir: player.dir,
      name: myId,
      t: firebase.database.ServerValue.TIMESTAMP
    });
  }
  // gửi lại vị trí định kỳ dù đứng yên, để timestamp luôn mới
  // (tránh bị các người chơi khác coi là "đã rời phòng")
  setInterval(() => broadcastPosition(true), 8000);


  const rotateRoot = document.getElementById('rotateRoot');
  const gameFrame = document.getElementById('gameFrame');

  function layout() {
    // dùng document.documentElement.clientWidth/Height: không đổi khi thanh địa chỉ
    // Chrome ẩn/hiện (khác với window.innerHeight hay bị nhảy số)
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    const forced = coarse && vh > vw; // điện thoại đang cầm dọc -> ép ngang

    if (forced) {
      rotateRoot.classList.add('forced-landscape');
      rotateRoot.style.width  = vh + 'px';
      rotateRoot.style.height = vw + 'px';
    } else {
      rotateRoot.classList.remove('forced-landscape');
      rotateRoot.style.width  = vw + 'px';
      rotateRoot.style.height = vh + 'px';
    }

    // không gian khả dụng thực tế cho khung game (sau khi xoay)
    const availW = forced ? vh : vw;
    const availH = forced ? vw : vh;

    const ratio = 960/540;
    let w = availW, h = availW/ratio;
    if (h > availH) { h = availH; w = availH*ratio; }

    gameFrame.style.width  = w + 'px';
    gameFrame.style.height = h + 'px';
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';

    positionInvBar();
  }

  // Đặt lại vị trí thanh túi đồ (ngay dưới nút "Trở về") theo tọa độ cục bộ
  // của gameFrame, để không bị lệch ra ngoài vùng nhìn thấy khi bị xoay ngang.
  function positionInvBar() {
    const backBtnEl = document.getElementById('backBtn');
    const invBarEl = document.getElementById('invBar');
    if (!backBtnEl || !invBarEl || !gameFrame) return;
    const off = offsetWithin(backBtnEl, gameFrame);
    invBarEl.style.top = (off.y + backBtnEl.offsetHeight + 8) + 'px';
    invBarEl.style.left = off.x + 'px';
  }

  // ---------- NHẠC NỀN ----------
  const bgMusicEl = document.getElementById('bgMusic');
  const musicBtnEl = document.getElementById('musicBtn');
  let musicOn = true;
  if (bgMusicEl) bgMusicEl.volume = 0.35;

  function tryPlayMusic() {
    if (!bgMusicEl || !musicOn) return;
    bgMusicEl.play().catch(() => {});
  }
  // Trình duyệt chặn autoplay có âm thanh trước khi người dùng tương tác,
  // nên bật nhạc ngay lần chạm/gõ phím đầu tiên.
  function unlockMusicOnce() {
    tryPlayMusic();
    window.removeEventListener('pointerdown', unlockMusicOnce);
    window.removeEventListener('keydown', unlockMusicOnce);
  }
  window.addEventListener('pointerdown', unlockMusicOnce);
  window.addEventListener('keydown', unlockMusicOnce);

  if (musicBtnEl) {
    musicBtnEl.addEventListener('click', () => {
      musicOn = !musicOn;
      musicBtnEl.textContent = musicOn ? '🔊' : '🔇';
      if (musicOn) tryPlayMusic();
      else if (bgMusicEl) bgMusicEl.pause();
    });
  }

  // ---------- ÂM THANH HIỆU ỨNG (tổng hợp bằng Web Audio API, không cần file) ----------
  let sfxCtx = null;
  function getSfxCtx() {
    if (!sfxCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) sfxCtx = new AC();
    }
    if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume().catch(()=>{});
    return sfxCtx;
  }
  // beep đơn giản: tần số, thời lượng (giây), dạng sóng, âm lượng
  function playTone(freq, dur, type, vol) {
    const ctx2 = getSfxCtx();
    if (!ctx2) return;
    const osc = ctx2.createOscillator();
    const gain = ctx2.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol != null ? vol : 0.18, ctx2.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + dur);
    osc.connect(gain).connect(ctx2.destination);
    osc.start();
    osc.stop(ctx2.currentTime + dur);
  }
  // Phát file âm thanh có sẵn (mp3), cho phép chồng tiếng khi bấm liên tục
  // bằng cách clone thẻ <audio> mỗi lần phát.
  function playSample(audioEl, vol) {
    if (!audioEl) return;
    const node = audioEl.cloneNode(true);
    node.volume = vol != null ? vol : 1;
    node.play().catch(()=>{});
  }
  const chopSoundEl = document.getElementById('chopSound');
  const mineSoundEl = document.getElementById('mineSound');
  const sfx = {
    chop:    () => playSample(chopSoundEl, 0.85),
    mine:    () => playSample(mineSoundEl, 0.85),
    pickup:  () => { playTone(660, 0.08, 'triangle', 0.14); setTimeout(()=>playTone(880, 0.1, 'triangle', 0.12), 60); },
    plant:   () => playTone(500, 0.1, 'sine', 0.12),
    harvest: () => { playTone(520, 0.08, 'triangle', 0.14); setTimeout(()=>playTone(780, 0.12, 'triangle', 0.14), 70); },
    buy:     () => { playTone(700, 0.07, 'sine', 0.14); setTimeout(()=>playTone(1000, 0.09, 'sine', 0.12), 50); },
    sell:    () => playTone(430, 0.1, 'sine', 0.14),
    fishHit: () => playTone(300, 0.08, 'square', 0.16),
    fishWin: () => { playTone(600, 0.09, 'triangle', 0.16); setTimeout(()=>playTone(900, 0.12, 'triangle', 0.16), 80); setTimeout(()=>playTone(1200, 0.14, 'triangle', 0.14), 160); },
    error:   () => playTone(160, 0.15, 'sawtooth', 0.12)
  };

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', layout);
  }
  layout();

  requestAnimationFrame(loop);

})();
</script>
</body>
